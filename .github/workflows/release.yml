name: Build and publish Circuit Design release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            asset: CircuitDesignApp-windows-x64.exe
          - platform: macos-arm64
            runner: macos-14
            asset: CircuitDesignApp-macos-arm64.zip

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka

      - name: Build executable
        run: python build_nuitka.py

      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/CircuitDesignApp.exe $env:GITHUB_WORKSPACE/CircuitDesignApp-windows-x64.exe

      - name: Prepare macOS asset
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/CircuitDesignApp CircuitDesignApp-macos-arm64.zip

      - name: Upload build asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets

      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Circuit Design ${{ inputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*